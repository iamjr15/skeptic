name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04, windows-2022]
        node: [22, 24]
    defaults:
      run:
        # Windows runners default to pwsh; force bash everywhere so the same
        # POSIX commands work on every platform.
        shell: bash
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Playwright caches browsers in an OS-specific location; a Linux-only path
      # means macOS/Windows never hit and re-download Chromium every run.
      - name: Resolve Playwright browsers cache path
        id: pw
        run: |
          case "${{ runner.os }}" in
            Linux)   echo "dir=$HOME/.cache/ms-playwright" >> "$GITHUB_OUTPUT" ;;
            macOS)   echo "dir=$HOME/Library/Caches/ms-playwright" >> "$GITHUB_OUTPUT" ;;
            Windows) echo "dir=$LOCALAPPDATA\\ms-playwright" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ${{ steps.pw.outputs.dir }}
          # The Playwright version lives in package-lock.json, so an upgrade
          # naturally busts the exact key. restore-keys prefix-matches the
          # latest browser cache so an unrelated lock change (e.g. a skeptic
          # version bump) restores the still-valid Chromium instead of
          # cold-downloading it; a real Playwright upgrade still re-downloads.
          key: ${{ runner.os }}-playwright-${{ hashFiles('cli/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
