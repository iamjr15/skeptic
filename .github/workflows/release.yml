name: Release

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  publish:
    name: Publish npm package
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "25.5"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Bump version to tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version --no-git-tag-version --allow-same-version "$VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Build package
        run: npm run build

      - name: Test package
        run: npx vitest run --maxWorkers=1 --minWorkers=1

      - name: Verify version stamping
        run: |
          STAMPED="$(node dist/skeptic.mjs --version)"
          EXPECTED="${GITHUB_REF_NAME#v}"
          if [[ "$STAMPED" != "$EXPECTED" ]]; then
            echo "::error::Version mismatch: bundle prints $STAMPED but tag is $EXPECTED"
            exit 1
          fi

      - name: Validate npm pack layout
        run: npm pack --dry-run

      - name: Publish main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "skeptic ${GITHUB_REF_NAME}" \
            --generate-notes
