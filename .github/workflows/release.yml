name: Release

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  id-token: write

# Serialize releases per tag so a second push can't race an in-flight publish.
# cancel-in-progress is false on purpose: never abort a job that may be mid-publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish npm package
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
        working-directory: cli
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Bump version to tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version --no-git-tag-version --allow-same-version "$VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Type-check
        run: npm run check

      - name: Build package
        run: npm run build

      - name: Test package
        run: npx vitest run --maxWorkers=1 --minWorkers=1

      - name: Verify version stamping
        run: |
          STAMPED="$(node dist/skeptic.mjs --version)"
          EXPECTED="${GITHUB_REF_NAME#v}"
          if [[ "$STAMPED" != "$EXPECTED" ]]; then
            echo "::error::Version mismatch: bundle prints $STAMPED but tag is $EXPECTED"
            exit 1
          fi

      - name: Validate npm pack layout
        run: npm pack --dry-run

      # Pack the real tarball and install it into a throwaway project to prove
      # the published artifact actually runs (bin resolves, dist is present,
      # version is stamped) before we publish it to the registry.
      - name: Smoke-test packed tarball
        run: |
          set -euo pipefail
          PKG="$(npm pack --silent)"
          echo "Packed tarball: $PKG"
          PKG_PATH="$PWD/$PKG"
          WORK="$(mktemp -d)"
          cd "$WORK"
          npm init -y >/dev/null
          # --ignore-scripts skips Playwright's browser download and skeptic's
          # agent-skill postinstall; neither is needed to smoke-test the CLI.
          npm install "$PKG_PATH" --ignore-scripts --no-audit --no-fund >/dev/null
          EXPECTED="${GITHUB_REF_NAME#v}"
          STAMPED="$(node_modules/.bin/skeptic --version)"
          if [[ "$STAMPED" != "$EXPECTED" ]]; then
            echo "::error::Installed tarball prints $STAMPED but tag is $EXPECTED"
            exit 1
          fi
          node_modules/.bin/skeptic --help >/dev/null
          echo "Tarball smoke test passed: skeptic $STAMPED"

      - name: Publish main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "skeptic ${GITHUB_REF_NAME}" \
            --generate-notes
