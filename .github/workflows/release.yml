name: Release

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  id-token: write

# Serialize releases per tag so a second push can't race an in-flight publish.
# cancel-in-progress is false on purpose: never abort a job that may be mid-publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish npm package
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: cli/package-lock.json

      # Restore the Chromium that ci.yml already cached for this exact
      # package-lock.json (identical key), turning the install below into a
      # no-op. This MUST run before the version bump, which rewrites
      # package-lock.json and would change the hashFiles() key — missing
      # ci.yml's cache and forcing a cold download that has wedged post-100%
      # under Node 24.
      - name: Resolve Playwright browsers cache path
        id: pw
        run: echo "dir=$HOME/.cache/ms-playwright" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ${{ steps.pw.outputs.dir }}
          key: ${{ runner.os }}-playwright-${{ hashFiles('cli/package-lock.json') }}

      - name: Bump version to tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version --no-git-tag-version --allow-same-version "$VERSION"

      - name: Install dependencies
        run: npm ci

      # On a cache hit this is an instant no-op. On a cold miss, `playwright
      # install` has wedged *after* a 100%-complete download under Node 24, so
      # bound each attempt and retry instead of letting it hang the job for
      # hours (3 × 180s, well under the 12-min step backstop).
      - name: Install Playwright Chromium
        timeout-minutes: 12
        run: |
          for attempt in 1 2 3; do
            if timeout 180 npx playwright install chromium; then
              exit 0
            fi
            echo "::warning::playwright install attempt $attempt timed out or failed; retrying"
            sleep 5
          done
          echo "::error::playwright chromium install failed after 3 attempts"
          exit 1

      - name: Type-check
        run: npm run check

      - name: Build package
        run: npm run build

      - name: Test package
        run: npx vitest run --maxWorkers=1 --minWorkers=1

      - name: Verify version stamping
        run: |
          STAMPED="$(node dist/skeptic.mjs --version)"
          EXPECTED="${GITHUB_REF_NAME#v}"
          if [[ "$STAMPED" != "$EXPECTED" ]]; then
            echo "::error::Version mismatch: bundle prints $STAMPED but tag is $EXPECTED"
            exit 1
          fi

      - name: Validate npm pack layout
        run: npm pack --dry-run

      # Pack the real tarball and install it into a throwaway project to prove
      # the published artifact actually runs (bin resolves, dist is present,
      # version is stamped) before we publish it to the registry.
      - name: Smoke-test packed tarball
        run: |
          set -euo pipefail
          PKG="$(npm pack --silent)"
          echo "Packed tarball: $PKG"
          PKG_PATH="$PWD/$PKG"
          WORK="$(mktemp -d)"
          cd "$WORK"
          npm init -y >/dev/null
          # --ignore-scripts skips Playwright's browser download and skeptic's
          # agent-skill postinstall; neither is needed to smoke-test the CLI.
          npm install "$PKG_PATH" --ignore-scripts --no-audit --no-fund >/dev/null
          EXPECTED="${GITHUB_REF_NAME#v}"
          STAMPED="$(node_modules/.bin/skeptic --version)"
          if [[ "$STAMPED" != "$EXPECTED" ]]; then
            echo "::error::Installed tarball prints $STAMPED but tag is $EXPECTED"
            exit 1
          fi
          node_modules/.bin/skeptic --help >/dev/null
          echo "Tarball smoke test passed: skeptic $STAMPED"

      # Publish via OIDC Trusted Publishing (configured on npm for
      # iamjr15/skeptic + release.yml). The workflow-level `id-token: write`
      # lets npm >= 11.5.1 (Node 24 ships 11.11.x) exchange the OIDC token for
      # a short-lived publish credential — no NPM_TOKEN needed.
      #
      # Cutover safety: the step env is named NPM_TOKEN (NOT NODE_AUTH_TOKEN),
      # so the first `npm publish` leaves setup-node's `_authToken` empty and
      # OIDC engages. Only if OIDC fails do we fall back to a token publish by
      # setting NODE_AUTH_TOKEN inline. A *static* NODE_AUTH_TOKEN would
      # preempt OIDC, so it must never be the step env. --provenance is kept on
      # both paths (automatic on OIDC; the token path needs it explicitly, else
      # that release would silently lose provenance).
      # Once OIDC is proven on a real release, simplify to a single
      # `npm publish --access public` and drop the NPM_TOKEN secret.
      - name: Publish main package
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if npm publish --provenance --access public; then
            echo "Published via OIDC trusted publishing"
          else
            echo "::warning::OIDC publish failed — falling back to NPM_TOKEN"
            NODE_AUTH_TOKEN="$NPM_TOKEN" npm publish --provenance --access public
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "skeptic ${GITHUB_REF_NAME}" \
            --generate-notes
