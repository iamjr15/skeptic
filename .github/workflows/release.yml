name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    name: Release guard
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test -n "$VERSION"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME#v}" != "$VERSION" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match workspace version ${VERSION}"
            exit 1
          fi
          node npm/skeptic-cli/scripts/check-versions.mjs
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: Build / ${{ matrix.asset }}
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            builder: cargo
            asset: darwin-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            builder: cargo
            asset: darwin-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            builder: zig
            asset: linux-x64
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            builder: zig
            asset: linux-arm64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            builder: zig
            asset: linux-musl-x64
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-musl
            builder: zig
            asset: linux-musl-arm64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            builder: cargo
            asset: win32-x64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Install cargo-zigbuild
        if: matrix.builder == 'zig'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Build
        if: matrix.builder == 'cargo'
        run: cargo build --locked --release -p skeptic-cli -p skeptic-runner -p skeptic-doctor -p skeptic-mobile -p skeptic-report --target ${{ matrix.target }}
      - name: Cross-build
        if: matrix.builder == 'zig'
        run: cargo zigbuild --locked --release -p skeptic-cli -p skeptic-runner -p skeptic-doctor -p skeptic-mobile -p skeptic-report --target ${{ matrix.target }}
      - name: Stage runtime bundle
        shell: bash
        run: |
          set -euo pipefail
          EXT=""
          case "${{ matrix.target }}" in
            *windows*) EXT=".exe" ;;
          esac
          mkdir -p dist
          for NAME in skeptic skeptic-runner skeptic-doctor skeptic-mobile skeptic-report; do
            cp "target/${{ matrix.target }}/release/${NAME}${EXT}" "dist/${NAME}-${{ matrix.asset }}${EXT}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  assemble:
    name: Checksums and attestations
    needs: [guard, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/skeptic-source.spdx.json
          upload-artifact: false
      - name: Create checksums
        working-directory: dist
        run: |
          sha256sum skeptic-* | sort -k2 > BINARY_SHA256SUMS
          node ../scripts/generate-homebrew-formula.mjs BINARY_SHA256SUMS skeptic.rb
          sha256sum skeptic-* skeptic.rb | sort -k2 > SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/skeptic-*
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes

  publish-npm:
    name: Publish npm packages
    needs: [guard, assemble]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: node npm/skeptic-cli/scripts/check-versions.mjs
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Publish platform packages then wrapper
        run: |
          set -euo pipefail
          node npm/skeptic-cli/scripts/stage-platform-packages.mjs dist
          for PACKAGE in npm/platforms/*; do npm publish "$PACKAGE" --provenance --access public; done
          npm publish npm/skeptic-cli --provenance --access public

  publish-homebrew:
    name: Update Homebrew tap
    needs: [guard, assemble]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - uses: actions/checkout@v4
        with:
          repository: iamjr15/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Publish formula
        working-directory: tap
        run: |
          mkdir -p Formula
          cp ../dist/skeptic.rb Formula/skeptic.rb
          git config user.name "skeptic-release"
          git config user.email "actions@users.noreply.github.com"
          git add Formula/skeptic.rb
          git diff --cached --quiet || git commit -m "skeptic ${{ needs.guard.outputs.version }}"
          git push
