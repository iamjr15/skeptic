name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      npm_release_tag:
        description: "Retry npm publication for an already-published GitHub release (for example v2.0.0)"
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-ci:
    name: Require CI for release commit
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    permissions:
      actions: read
    steps:
      - name: Wait for both main-branch validation workflows
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          while (( SECONDS < 2700 )); do
            RUNS="$(gh run list --commit "$GITHUB_SHA" --branch main --event push --limit 50 \
              --json databaseId,workflowName,status,conclusion | jq '
              group_by(.workflowName) | map(max_by(.databaseId)) |
              map(select(.workflowName == "CI" or .workflowName == "deno_core target spike"))')"
            if jq -e 'any(.[]; .status == "completed" and .conclusion != "success")' <<<"$RUNS" >/dev/null; then
              echo "::error::A required validation workflow failed for $GITHUB_SHA"
              jq . <<<"$RUNS"
              exit 1
            fi
            if jq -e 'length == 2 and all(.[]; .status == "completed" and .conclusion == "success")' <<<"$RUNS" >/dev/null; then
              echo "Both validation workflows passed for $GITHUB_SHA"
              exit 0
            fi
            echo "Waiting for CI and V8 validation for $GITHUB_SHA"
            sleep 30
          done
          echo "::error::Timed out waiting for validation workflows"
          exit 1

  guard:
    name: Release guard
    if: github.event_name != 'workflow_dispatch' || inputs.npm_release_tag == ''
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test -n "$VERSION"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME#v}" != "$VERSION" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match workspace version ${VERSION}"
            exit 1
          fi
          node npm/skeptic-cli/scripts/check-versions.mjs
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: Build / ${{ matrix.asset }}
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            builder: cargo
            asset: darwin-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            builder: cargo
            asset: darwin-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            builder: zig
            asset: linux-x64
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            builder: zig
            asset: linux-arm64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            builder: zig
            asset: linux-musl-x64
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-musl
            builder: zig
            asset: linux-musl-arm64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            builder: cargo
            asset: win32-x64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install NASM
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Install Zig
        if: matrix.builder == 'zig'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - name: Install cargo-zigbuild
        if: matrix.builder == 'zig'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Build
        if: matrix.builder == 'cargo'
        run: cargo build --locked --release -p skeptic-cli -p skeptic-runner -p skeptic-doctor -p skeptic-mobile -p skeptic-report --target ${{ matrix.target }}
      - name: Cross-build
        if: matrix.builder == 'zig'
        run: cargo zigbuild --locked --release -p skeptic-cli -p skeptic-runner -p skeptic-doctor -p skeptic-mobile -p skeptic-report --target ${{ matrix.target }}
      - name: Stage runtime bundle
        shell: bash
        run: |
          set -euo pipefail
          EXT=""
          case "${{ matrix.target }}" in
            *windows*) EXT=".exe" ;;
          esac
          mkdir -p dist
          for NAME in skeptic skeptic-runner skeptic-doctor skeptic-mobile skeptic-report; do
            cp "target/${{ matrix.target }}/release/${NAME}${EXT}" "dist/${NAME}-${{ matrix.asset }}${EXT}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  smoke-bundles:
    name: Artifact smoke / ${{ matrix.asset }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: linux-x64
          - os: macos-14
            asset: darwin-arm64
          - os: macos-15-intel
            asset: darwin-x64
          - os: windows-2022
            asset: win32-x64
    steps:
      # Only fetch the smoke script. The build checkout and Cargo sources must
      # not exist here, otherwise absolute build-path dependencies go unnoticed.
      - uses: actions/checkout@v4
        with:
          path: smoke-source
          sparse-checkout: scripts/smoke-runtime.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist
      - run: node smoke-source/scripts/smoke-runtime.mjs dist ${{ matrix.asset }}

  assemble:
    name: Checksums and attestations
    needs: [guard, build, verify-ci, smoke-bundles]
    if: always() && needs.guard.result == 'success' && needs.build.result == 'success' && needs.smoke-bundles.result == 'success' && (needs.verify-ci.result == 'success' || github.ref_type != 'tag')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/skeptic-source.spdx.json
          upload-artifact: false
      - name: Create checksums
        working-directory: dist
        run: |
          sha256sum skeptic-* | sort -k2 > BINARY_SHA256SUMS
          node ../scripts/generate-homebrew-formula.mjs BINARY_SHA256SUMS skeptic.rb
          sha256sum skeptic-* skeptic.rb | sort -k2 > SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/skeptic-*
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes

  publish-npm:
    name: Publish npm packages
    needs: [guard, assemble]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: node npm/skeptic-cli/scripts/check-versions.mjs
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      # Each native package needs an initial authenticated publish and its own
      # trusted publisher before this optional distribution path can be enabled.
      - name: Publish platform packages
        if: vars.PUBLISH_NATIVE_NPM_PACKAGES == 'true'
        run: |
          set -euo pipefail
          node npm/skeptic-cli/scripts/stage-platform-packages.mjs dist
          for PACKAGE in npm/platforms/*; do npm publish "./$PACKAGE" --provenance --access public; done
      - name: Publish npm wrapper
        run: npm publish --provenance --access public
        working-directory: npm/skeptic-cli

  publish-existing-npm:
    name: Retry npm for published release
    if: github.event_name == 'workflow_dispatch' && inputs.npm_release_tag != ''
    runs-on: ubuntu-22.04
    steps:
      - name: Require an existing published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.npm_release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,assets |
            jq -e '.isDraft == false and .isPrerelease == false and any(.assets[]; .name == "SHA256SUMS")'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.npm_release_tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Verify the released package version
        env:
          RELEASE_TAG: ${{ inputs.npm_release_tag }}
        run: |
          node npm/skeptic-cli/scripts/check-versions.mjs
          node --input-type=module -e 'import fs from "node:fs"; const pkg = JSON.parse(fs.readFileSync("npm/skeptic-cli/package.json")); if ("v" + pkg.version !== process.env.RELEASE_TAG) throw new Error("release tag and npm version differ");'
      - name: Publish released npm wrapper
        run: npm publish --provenance --access public
        working-directory: npm/skeptic-cli

  publish-homebrew:
    name: Update Homebrew tap
    needs: [guard, assemble]
    if: github.ref_type == 'tag' && vars.PUBLISH_HOMEBREW_TAP == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - uses: actions/checkout@v4
        with:
          repository: iamjr15/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Publish formula
        working-directory: tap
        run: |
          mkdir -p Formula
          cp ../dist/skeptic.rb Formula/skeptic.rb
          git config user.name "skeptic-release"
          git config user.email "actions@users.noreply.github.com"
          git add Formula/skeptic.rb
          git diff --cached --quiet || git commit -m "skeptic ${{ needs.guard.outputs.version }}"
          git push
