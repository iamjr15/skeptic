<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Test App</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 0 auto; padding: 2rem; }
    h1 { margin-bottom: 1.5rem; }
    form { display: flex; flex-direction: column; gap: 1rem; }
    label { font-size: 0.875rem; color: #555; }
    input, textarea { padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
    textarea { min-height: 100px; resize: vertical; }
    button { padding: 0.625rem; background: #0066cc; color: white; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1 data-testid="contact-heading">Contact</h1>
    <form data-testid="contact-form">
      <div>
        <label for="name">Name</label>
        <input type="text" id="name" data-testid="name-input" placeholder="Your name" required>
      </div>
      <div>
        <label for="message">Message</label>
        <textarea id="message" data-testid="message-input" placeholder="Your message" required></textarea>
      </div>
      <button type="submit" data-testid="send-button">Send</button>
    </form>
  </main>
</body>
</html>
