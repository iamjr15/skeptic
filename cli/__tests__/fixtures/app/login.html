<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Test App</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; max-width: 400px; margin: 4rem auto; padding: 2rem; }
    h1 { margin-bottom: 1.5rem; text-align: center; }
    form { display: flex; flex-direction: column; gap: 1rem; }
    label { font-size: 0.875rem; color: #555; }
    input { padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
    button { padding: 0.625rem; background: #0066cc; color: white; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; }
    button:hover { background: #0052a3; }
  </style>
</head>
<body>
  <h1>Login</h1>
  <form data-testid="login-form" id="login-form">
    <div>
      <label for="email">Email</label>
      <input type="email" id="email" data-testid="email-input" placeholder="Email" required>
    </div>
    <div>
      <label for="password">Password</label>
      <input type="password" id="password" data-testid="password-input" placeholder="Password" required>
    </div>
    <button type="submit" data-testid="sign-in-button">Sign In</button>
  </form>
  <script>
    document.getElementById("login-form").addEventListener("submit", function(e) {
      e.preventDefault();
      window.location.href = "dashboard.html";
    });
  </script>
</body>
</html>
