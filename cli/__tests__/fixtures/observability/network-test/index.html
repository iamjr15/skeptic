<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>net smoke</title></head>
<body>
<h1>Network smoke test</h1>
<button id="trigger-failures">trigger failures</button>
<button id="trigger-dns">trigger DNS failure</button>
<script>
  document.getElementById('trigger-failures').addEventListener('click', () => {
    fetch('/api');           // 500 from server
    fetch('/dup');           // 200
    fetch('/dup');           // 200 — same-tick duplicate
  });
  document.getElementById('trigger-dns').addEventListener('click', () => {
    fetch('http://nonexistent.invalid.skeptic-test/').catch(() => {});
  });
</script>
</body>
</html>
