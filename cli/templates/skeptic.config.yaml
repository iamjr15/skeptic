# skeptic configuration
# Docs: https://skeptic.dev/docs/config

# Base URL for all tests (override per-test with `test.use({ url: ... })`)
# url: http://localhost:3000

# Glob patterns for test files
tests: "tests/**/*.spec.ts"

browser:
  engine: chromium
  headless: true
  timeout: 30000
  viewport:
    width: 1280
    height: 720

auth:
  cookies: false

execution:
  retries: 0
  bail: false
  screenshotOnFailure: true

output:
  dir: ./skeptic-output
  reporters:
    - console

env: {}
