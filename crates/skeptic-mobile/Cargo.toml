[package]
name = "skeptic-mobile"
version.workspace = true
edition.workspace = true
description = "Direct Android and iOS Simulator QA drivers for Skeptic"
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "skeptic-mobile"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
base64 = "0.23"
dirs = "6"
flate2 = "1"
quick-xml = "0.38"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
skeptic-contract = { path = "../skeptic-contract" }
skeptic-daemon = { path = "../skeptic-daemon" }
skeptic-evidence = { path = "../skeptic-evidence" }
sha2 = "0.10"
tar = "0.4"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
